[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MagiCircles"
version = "1.0"
description = "Let's do some magic!"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Simple non code license (SNCL), see LICENCE" }
authors = [
    { name = "Deby Lepage", email = "db0company@gmail.com" },
]
dependencies = [
    "Django==5.2.16",
    "Pillow==12.3.0",
    "Wand==0.5.3",
    "django-bootstrap-form==3.2",
    "django-common-helpers==0.7.0",
    "django-cors-headers==3.13.0",
    "django-filter==26.1",
    "django-multiupload==0.6.1",
    "django-oauth-toolkit==0.10.0",
    "django-recaptcha3==0.4.0",
    "django-ses==0.7.0",
    "django-storages>=1.14.6",
    "djangorestframework==3.14.0",
    "geopy==1.9.1",
    "python-dateutil>=2.9.0",
    "pytz==2025.2",
    "requests==2.32.3",
    "simplejson==3.8.0",
    "tinify==1.5.2",
]

[project.urls]
Homepage = "https://github.com/SchoolIdolTomodachi/MagiCircles"

[project.optional-dependencies]
# Only needed to build the Sphinx docs, not at app runtime.
docs = [
    "Babel==2.0",
    "Jinja2==2.8",
    "MarkupSafe==0.23",
    "Pygments==2.18.0",
    "Sphinx==1.3.1",
    "alabaster==0.7.6",
    "docutils==0.12",
    "snowballstemmer==1.2.0",
    "sphinx-rtd-theme==0.1.9",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["magi*"]

[dependency-groups]
# Only needed to run this package's own test suite (tests/), not by consumers.
test = [
    "redgreenunittest==0.1.1",
]
